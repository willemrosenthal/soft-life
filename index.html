<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Softlife</title>
  <meta name="description" content="Conway's Game of Life with cells that merge into soft blobs.">
  <meta name="theme-color" content="#F3F5EF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Softlife">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
</head>
<body>
  <div class="app" id="app">
    <main class="board" id="board">
      <canvas id="cv" aria-label="Game board. Tap or drag to draw cells."></canvas>
      <div class="toast" id="toast" role="status" hidden></div>
    </main>

    <div class="shade" id="shade"></div>

    <!-- Shown while the rail is tucked away; drag or tap it to bring the rail back. -->
    <button type="button" class="rail-tab" id="railTab" data-drag="rail" aria-label="Show tools" aria-controls="rail" aria-expanded="true" title="Show tools (H)"></button>

    <nav class="rail-wrap" id="rail" aria-label="Tools">
      <div class="rail" data-drag="rail">
        <button type="button" class="rail-play" id="btnPlay" aria-label="Pause" title="Play / pause (Space)">
          <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"></svg>
        </button>
        <button type="button" class="rb" id="btnColour" data-pop="colourPop" aria-controls="colourPop" aria-expanded="false" aria-label="Colour" title="Colour">
          <span class="rail-sw" id="railSw"></span>
        </button>
        <button type="button" class="rb" id="btnSize" data-pop="sizePop" aria-controls="sizePop" aria-expanded="false" aria-label="Draw size" title="Draw size">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg>
          <span class="badge" id="sizeBadge"></span>
        </button>
        <button type="button" class="rb" id="btnBoard" data-pop="boardPop" aria-controls="boardPop" aria-expanded="false" aria-label="Density and speed" title="Density and speed">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>
        </button>
        <hr>
        <button type="button" class="rb" id="btnRand" aria-label="Random soup" title="Random soup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/></svg>
        </button>
        <button type="button" class="rb" id="btnClear" aria-label="Clear board" title="Clear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M10 11v6M14 11v6M7 7l1 12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
        <button type="button" class="rb" id="btnShare" aria-label="Share pattern link" title="Share">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        </button>
        <hr>
        <button type="button" class="rb" id="btnLib" aria-controls="libPanel" aria-label="Pattern library" title="Patterns">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
        </button>
        <button type="button" class="rb" id="btnSet" aria-controls="setPanel" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        </button>
      </div>
    </nav>

    <!-- Pop-ups beside the rail. -->
    <div class="pop" id="colourPop" role="dialog" aria-label="Colour" hidden>
      <h3>Colour</h3>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="pop" id="sizePop" role="dialog" aria-label="Draw size" hidden>
      <h3><label for="size">Draw size</label><output id="sizeOut" for="size"></output></h3>
      <div class="pop-row"><input type="range" id="size" min="1" max="7"><canvas class="brush-preview" id="sizePreview" aria-hidden="true"></canvas></div>
    </div>
    <div class="pop" id="boardPop" role="dialog" aria-label="Density and speed" hidden>
      <h3><label for="density">Density</label><output id="densityOut" for="density"></output></h3>
      <input type="range" id="density">
      <h3><label for="speed">Speed</label><output id="speedOut" for="speed"></output></h3>
      <input type="range" id="speed" min="1" max="30">
      <div class="pop-foot">
        <span class="stats"><span id="gen">Gen 0</span><span id="popCount">Pop 0</span></span>
        <button type="button" class="pill" id="btnStep">Step</button>
      </div>
    </div>

  <aside class="panel" id="libPanel" role="dialog" aria-modal="true" aria-labelledby="libTitle">
    <div class="panel-head">
      <h2 id="libTitle">Patterns</h2>
      <span class="stats" id="libCount"></span>
      <button type="button" class="ib ib-sm" data-close aria-label="Close patterns">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <input class="search" id="q" type="search" placeholder="Search glider, pulsar…" aria-label="Search patterns">
      <div class="chips" id="chips">
        <button type="button" class="chip" data-cat="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-cat="Spaceship" aria-pressed="false">Spaceships</button>
        <button type="button" class="chip" data-cat="Oscillator" aria-pressed="false">Oscillators</button>
        <button type="button" class="chip" data-cat="Methuselah" aria-pressed="false">Methuselahs</button>
      </div>
      <div class="lib" id="lib"></div>
      <p class="empty" id="libEmpty" hidden>No pattern matches that.</p>
    </div>
  </aside>

  <aside class="panel" id="setPanel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="panel-head">
      <h2 id="setTitle">Settings</h2>
      <button type="button" class="ib ib-sm" data-close aria-label="Close settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <div class="group"><h3>Theme</h3><div class="themes" id="themes"></div></div>
      <div class="group"><h3>Cell style</h3>
        <div class="seg" data-key="style"><button type="button" data-v="goo">Goo</button><button type="button" data-v="dots">Dots</button><button type="button" data-v="pixels">Pixels</button></div></div>
      <div class="group"><h3>Colour</h3>
        <div class="seg" data-key="mode"><button type="button" data-v="colonies">Colonies</button><button type="button" data-v="solo">Solo</button><button type="button" data-v="age">Age</button></div></div>
      <div class="group"><h3>Rule</h3>
        <div class="list" data-key="rule">
          <button type="button" class="row" data-v="B3/S23"><span>Conway's Life<code>B3/S23</code></span><i class="radio"></i></button>
          <button type="button" class="row" data-v="B36/S23"><span>HighLife<code>B36/S23</code></span><i class="radio"></i></button>
          <button type="button" class="row" data-v="B3678/S34678"><span>Day &amp; Night<code>B3678/S34678</code></span><i class="radio"></i></button>
          <button type="button" class="row" data-v="B2/S"><span>Seeds<code>B2/S</code></span><i class="radio"></i></button>
        </div></div>
      <div class="group"><h3>Behaviour</h3>
        <div class="list">
          <button type="button" class="row" role="switch" data-toggle="smooth"><span>Smooth transitions<small>Cells grow in and melt away</small></span><i class="switch"></i></button>
          <button type="button" class="row" role="switch" data-toggle="critters"><span>Critters<small>Long-lived cells open an eye and look around</small></span><i class="switch"></i></button>
          <button type="button" class="row" role="switch" data-toggle="wrap"><span>Wrap edges<small>The board is a torus</small></span><i class="switch"></i></button>
        </div></div>
      <p class="hint">Swipe the rail off the right edge to clear the screen; swipe in from the edge to bring it back. Keyboard: Space plays and pauses, H hides or shows the rail.</p>
    </div>
  </aside>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
